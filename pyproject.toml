[project]
name = "seqtools"
version = "0.1.0"
description = "Small tools for working with DNA sequences, for practicing code review with a coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
